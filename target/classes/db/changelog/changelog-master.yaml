databaseChangeLog:
  - changeSet:
      id: 001-create-short-url
      author: ian
      changes:
        - createTable:
            tableName: short_url
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: long_url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: short_url
            columnNames: code
            constraintName: uk_short_url_code

        - createIndex:
            tableName: short_url
            indexName: idx_short_url_long_url
            columns:
              - column:
                  name: long_url